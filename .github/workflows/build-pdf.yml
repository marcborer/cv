name: Build CV PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build PDFs
        run: npm run build

      - name: Keep the old German file name as an alias
        run: cp dist/Lebenslauf-Marc-Borer-DE.pdf dist/Lebenslauf.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: |
            dist/Lebenslauf-Marc-Borer-DE.pdf
            dist/CV-Marc-Borer-EN.pdf

      - name: Force-update latest tag
        run: |
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          git tag latest
          git push origin latest

      - name: Create/Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest CV
          body: "Automatically built from the latest commit on main. Lebenslauf-Marc-Borer-DE.pdf is German, CV-Marc-Borer-EN.pdf is English; Lebenslauf.pdf is the German file under its former name, for links already in circulation."
          files: |
            dist/Lebenslauf-Marc-Borer-DE.pdf
            dist/CV-Marc-Borer-EN.pdf
            dist/Lebenslauf.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
